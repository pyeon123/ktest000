<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8QTRE4CGNE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-8QTRE4CGNE');
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Today’s Mock Test | K-Free</title>
    <meta name="description" content="New EPS-TOPIK practice questions every day. If you get one wrong, go straight to the related lesson, study it, and try again.">
    <link rel="stylesheet" href="style.css">

    <style>
        :root { --dq-primary: #4f46e5; --dq-secondary: #7c3aed; }
        * { box-sizing: border-box; }
        body { background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; margin: 0; color: #1e293b; }

        .dq-app { max-width: 520px; margin: 0 auto; padding: 16px; padding-bottom: 60px; }

        .dq-topbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 2px 16px; }
        .dq-topbar a { text-decoration: none; color: #64748b; font-weight: 700; font-size: 0.85rem; }

        .dq-hero { text-align: center; margin-bottom: 14px; }
        .dq-hero h1 { font-size: 1.35rem; margin: 4px 0 8px; }
        .dq-countdown { display: inline-block; background: #eef2ff; color: var(--dq-primary); font-weight: 800; font-size: 0.78rem; padding: 6px 14px; border-radius: 20px; }

        .dq-progress-bar { display: flex; justify-content: center; margin: 16px 0 18px; }
        .dq-progress-bar .pill { background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 6px 16px; font-weight: 800; font-size: 0.82rem; color: #475569; }

        .dq-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 22px; box-shadow: 0 4px 14px rgba(0,0,0,.05); }
        .dq-q { font-size: 1.05rem; font-weight: 700; line-height: 1.7; white-space: pre-line; margin-bottom: 18px; }

        .dq-opt { display: block; width: 100%; text-align: left; padding: 14px 16px; margin-bottom: 10px; background: #fff; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 0.95rem; font-weight: 700; color: #334155; cursor: pointer; transition: all .12s; }
        .dq-opt:not(:disabled):hover { border-color: var(--dq-primary); }
        .dq-opt:disabled { cursor: default; }
        .dq-opt.correct { border-color: #22c55e; background: #f0fdf4; color: #15803d; }
        .dq-opt.wrong { border-color: #ef4444; background: #fef2f2; color: #b91c1c; }

        .dq-feedback { margin-top: 14px; }
        .dq-fb { padding: 14px 16px; border-radius: 12px; font-weight: 800; font-size: 0.95rem; text-align: center; }
        .dq-fb.correct { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
        .dq-fb.wrong { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }

        .dq-actions { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
        .dq-study-btn { display: block; text-align: center; text-decoration: none; padding: 14px; border-radius: 12px; background: #fffbeb; border: 2px solid #fde68a; color: #92400e; font-weight: 800; font-size: 0.92rem; }
        .dq-next-btn { padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--dq-primary), var(--dq-secondary)); color: #fff; font-weight: 800; font-size: 0.95rem; cursor: pointer; }

        .dq-done-card { text-align: center; padding: 20px 10px; }
        .dq-done-card .emoji { font-size: 2.6rem; }
        .dq-done-card .title { font-weight: 800; font-size: 1.1rem; margin: 8px 0 4px; }
        .dq-done-card .score { font-weight: 900; font-size: 1.6rem; color: var(--dq-primary); margin: 6px 0; }
        .dq-done-card .note { color: #64748b; font-size: 0.85rem; }

        .dq-mocktest-promo { margin-top: 26px; background: linear-gradient(135deg, #1e1b4b, #4c1d95); border-radius: 16px; padding: 20px; color: #fff; text-align: center; text-decoration: none; display: block; }
        .dq-mocktest-promo .badge { display: inline-block; background: rgba(255,255,255,.15); font-size: 0.7rem; font-weight: 800; padding: 3px 10px; border-radius: 20px; margin-bottom: 8px; }
        .dq-mocktest-promo .title { font-weight: 900; font-size: 1.05rem; margin-bottom: 4px; }
        .dq-mocktest-promo .sub { font-size: 0.8rem; opacity: .85; }
    </style>
</head>
<body>
<div class="dq-app">

    <div class="dq-topbar">
        <a href="index.html">🏠 Home</a>
        <span id="dq-header-empty"></span>
    </div>

    <div class="dq-hero">
        <h1>📝 Today’s Mock Test <span style="color:#22c55e;font-size:0.85rem;">FREE</span></h1>
        <div class="dq-countdown" id="dq-countdown">⏰ New questions in...</div>
    </div>

    <div class="dq-progress-bar">
        <div class="pill" id="dq-progress">1 / 10</div>
    </div>

    <div class="dq-card">
        <div class="dq-q" id="dq-question"></div>
        <div id="dq-options"></div>
        <div class="dq-feedback" id="dq-feedback"></div>
        <div class="dq-actions" id="dq-actions"></div>
    </div>

   <a href="test.html" class="dq-mocktest-promo">
    <div class="badge">🔒 Members Only</div>
    <div class="title">🎯 EPS-TOPIK Mock Tests</div>
    <div class="sub">Practice like the real test with 20 Listening + 20 Reading questions in 50 minutes.</div>
</a>

</div>

<script src="dailyQuizBank.js"></script>
<script src="script.js"></script>

<script>
(function(){
    let dqState = { queue: [], index: 0, answers: {} };

    function progressKey(){
        return `dailyQuizProgress:${window.getTodayDateStr()}`;
    }

    function loadProgress(){
        try {
            const raw = sessionStorage.getItem(progressKey());
            const parsed = raw ? JSON.parse(raw) : null;
            return parsed || { index: 0, answers: {} };
        } catch(e) {
            return { index: 0, answers: {} };
        }
    }

    function saveProgress(){
        try {
            sessionStorage.setItem(progressKey(), JSON.stringify({
                index: dqState.index,
                answers: dqState.answers
            }));
        } catch(e) {}
    }

    function escapeDaily(t){
        return String(t == null ? '' : t)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function updateCountdown(){
        const now = new Date();
        const nextMidnight = new Date(now);
        nextMidnight.setHours(24, 0, 0, 0);
        const diffMs = nextMidnight - now;
        const h = Math.floor(diffMs / 3600000);
        const m = Math.floor((diffMs % 3600000) / 60000);
        const el = document.getElementById('dq-countdown');
        if (el) el.textContent = `⏰ New questions in ${h}h ${m}m`;
    }

    function render(){
        if (dqState.index >= dqState.queue.length) {
            renderDone();
            return;
        }

        const q = dqState.queue[dqState.index];
        const answered = dqState.answers[dqState.index];

        document.getElementById('dq-progress').textContent = `${dqState.index + 1} / ${dqState.queue.length}`;
        document.getElementById('dq-question').textContent = q.question;

        const optWrap = document.getElementById('dq-options');
        optWrap.innerHTML = '';
        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'dq-opt';
            btn.textContent = `${i + 1}. ${opt}`;
            if (answered != null) {
                btn.disabled = true;
                if (i === q.answer) btn.classList.add('correct');
                else if (i === answered.selected) btn.classList.add('wrong');
            } else {
                btn.onclick = () => selectAnswer(i);
            }
            optWrap.appendChild(btn);
        });

        const feedbackWrap = document.getElementById('dq-feedback');
        const actionsWrap = document.getElementById('dq-actions');

        if (answered != null) {
    const isCorrect = answered.selected === q.answer;

    feedbackWrap.innerHTML = isCorrect
        ? `<div class="dq-fb correct">⭕ Correct!</div>`
        : `<div class="dq-fb wrong">❌ Incorrect. The correct answer is "${escapeDaily(q.options[q.answer])}".</div>`;

    const isLast = dqState.index + 1 >= dqState.queue.length;

    actionsWrap.innerHTML = `
        ${q.sourceUrl ? `<a class="dq-study-btn" href="${q.sourceUrl}">📚 Study this lesson</a>` : ''}
        <button class="dq-next-btn" id="dq-next-btn">${isLast ? 'See Results →' : 'Next Question →'}</button>
    `;

    document.getElementById('dq-next-btn').onclick = () => {
        dqState.index++;
        saveProgress();
        render();
    };
}
        } else {
            feedbackWrap.innerHTML = '';
            actionsWrap.innerHTML = '';
        }
    }

    function selectAnswer(i){
        const q = dqState.queue[dqState.index];
        dqState.answers[dqState.index] = { selected: i, correct: i === q.answer };
        saveProgress();
        render();
    }

    function renderDone(){
        document.getElementById('dq-progress').textContent = '완료';
        document.getElementById('dq-question').textContent = '';
        document.getElementById('dq-options').innerHTML = '';

        const total = dqState.queue.length;
        const correctCount = Object.values(dqState.answers).filter(a => a.correct).length;

       document.getElementById('dq-feedback').innerHTML = `
    <div class="dq-done-card">
        <div class="emoji">🎉</div>
        <div class="title">You completed today’s test!</div>
        <div class="score">${correctCount} / ${total} correct</div>
        <div class="note">Come back tomorrow for new questions.</div>
    </div>
`;
document.getElementById('dq-actions').innerHTML = '';

    function init(){
        // 날짜가 바뀌면(자정 이후) 큐도 자동으로 새로 생성되고,
        // progressKey도 날짜별로 다르므로 진행 상태도 자연스럽게 초기화됨.
        dqState.queue = window.buildDailyQuizQueue(10);
        const saved = loadProgress();
        dqState.index = Math.min(saved.index || 0, dqState.queue.length);
        dqState.answers = saved.answers || {};
        updateCountdown();
        render();
    }

    // pageshow: 새로고침뿐 아니라 "뒤로가기"로 돌아왔을 때(bfcache 포함)도
    // 항상 같은 지점부터 다시 보여주기 위해 사용.
    window.addEventListener('pageshow', init);
    setInterval(updateCountdown, 30000);
})();
</script>
</body>
</html>
