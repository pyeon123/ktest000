<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPS-TOPIK 모의고사 | 비상벨 안전 어휘 실전 연습 (EPS-TOPIK Mock Test)</title>
<meta name="description" content="EPS-TOPIK 모의고사 연습. 듣기·읽기 형식으로 비상벨 등 현장 안전 어휘를 무료로 연습하세요. Free EPS-TOPIK mock test with listening and reading questions.">
<meta name="keywords" content="EPS-TOPIK 모의고사, EPS-TOPIK mock test, EPS-TOPIK 듣기 읽기, 비상벨, 한국어능력시험 연습, EPS-TOPIK 기출 형식, 비상벨 어휘">
<meta property="og:title" content="EPS-TOPIK 모의고사 - 비상벨 안전 어휘 실전 연습">
<meta property="og:description" content="듣기·읽기 형식의 무료 EPS-TOPIK 연습 문제 (Free EPS-TOPIK mock test).">
<meta property="og:type" content="website">
<link rel="canonical" href="https://pyeon123.github.io/ktest000/epstopik-mock-bisangbel.html">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Quiz",
  "name": "EPS-TOPIK 모의고사 - 비상벨 안전 어휘",
  "about": "EPS-TOPIK",
  "educationalLevel": "Beginner",
  "inLanguage": ["ko", "en"],
  "learningResourceType": "Mock test"
}
</script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.6}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:1.5rem;margin:8px 0 4px}
  .sub{color:#475569;margin:0 0 14px;font-weight:600}
  .notice{background:#fff7ed;border-left:6px solid #f59e0b;padding:10px 14px;border-radius:8px;font-size:.92rem;margin-bottom:14px}
  .topbar{position:sticky;top:0;background:#1e3a8a;color:#fff;padding:10px 16px;border-radius:10px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;z-index:5}
  section h2{font-size:1.2rem;border-bottom:2px solid #cbd5e1;padding-bottom:6px;margin-top:28px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 4px rgba(0,0,0,.04)}
  .qno{font-weight:900;color:#1d4ed8;margin-bottom:6px}
  .passage{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:10px;font-size:1.02rem}
  .question{font-weight:700;margin-bottom:10px}
  .play{background:#4285f4;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:.98rem;cursor:pointer;margin-bottom:10px}
  .opts label{display:block;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0;cursor:pointer}
  .opts label:hover{background:#eef2ff}
  .exp{display:none;margin-top:10px;padding:12px;border-radius:10px;font-size:.93rem}
  .exp.ok{display:block;background:#ecfdf5;border:1px solid #6ee7b7}
  .exp.ng{display:block;background:#fef2f2;border:1px solid #fca5a5}
  .script{color:#475569;margin-top:6px}
  .btn{display:block;width:100%;max-width:340px;margin:24px auto;background:#1d4ed8;color:#fff;border:none;border-radius:12px;padding:14px;font-size:1.05rem;font-weight:800;cursor:pointer}
  .btn.gray{background:#64748b}
  #result{text-align:center;background:#fff;border-radius:14px;padding:20px;border:2px solid #1d4ed8;display:none}
  #result .score{font-size:2rem;font-weight:900;color:#1d4ed8}
</style>
</head>
<body>
<div class="wrap">
  <h1>EPS-TOPIK 모의고사 (비상벨 안전 어휘)</h1>
  <p class="sub">EPS-TOPIK Mock Test · 듣기 6문항 + 읽기 6문항 · 제한시간 15분</p>
  <div class="notice">※ 실제 시험 문제가 아닌 연습용 문제입니다. (This is a practice set, not official exam content.)</div>

  <div class="topbar">
    <span>⏱ 남은 시간 (Time left)</span>
    <b id="timer">15:00</b>
  </div>

  <section>
    <h2>제1부 듣기 (Listening)</h2>
    <p style="font-size:.9rem;color:#64748b">🔊 버튼을 누르면 대화가 두 번 재생됩니다. (Each dialogue plays twice.)</p>
    <div id="listen"></div>
  </section>

  <section>
    <h2>제2부 읽기 (Reading)</h2>
    <div id="read"></div>
  </section>

  <button class="btn" id="submitBtn" onclick="submitTest()">제출하기 (Submit)</button>
  <div id="result"></div>
</div>

<script>
const Q = [
  // ----- 듣기 (Listening) -----
  { type:'listen',
    script:'여자: 비상벨이 어디에 있어요? 남자: 계단 옆에 있어요.',
    q:'비상벨은 어디에 있습니까?',
    opts:['계단 옆','화장실 안','사무실 책상 위','주차장 입구'], ans:0 },
  { type:'listen',
    script:'남자: 비상벨은 어떻게 작동해요? 여자: 빨간 버튼을 세게 누르면 돼요.',
    q:'비상벨은 어떻게 작동합니까?',
    opts:['문을 닫는다','빨간 버튼을 세게 누른다','전화를 건다','조명을 끈다'], ans:1 },
  { type:'listen',
    script:'여자: 소방 점검은 언제예요? 남자: 내일 오전 열 시예요.',
    q:'소방 점검은 몇 시입니까?',
    opts:['오전 9시','오전 10시','오후 2시','오후 4시'], ans:1 },
  { type:'listen',
    script:'남자: 기계에서 소리가 안 나요. 여자: 먼저 전원이 켜져 있는지 확인해 보세요.',
    q:'여자가 먼저 확인하라고 한 것은 무엇입니까?',
    opts:['전원','문 손잡이','창문','사원증'], ans:0 },
  { type:'listen',
    script:'남자: 화재가 나면 어떻게 해요? 여자: 비상벨을 누르고 빨리 밖으로 대피하세요.',
    q:'화재가 났을 때 해야 할 행동으로 맞는 것은?',
    opts:['엘리베이터를 탄다','비상벨을 누르고 대피한다','물건을 챙긴다','그냥 기다린다'], ans:1 },
  { type:'listen',
    script:'여자: 안전모는 어디에 있어요? 남자: 창고 안 선반 위에 있어요.',
    q:'안전모는 어디에 있습니까?',
    opts:['창고 안 선반 위','사무실 문 앞','기숙사 침대 밑','작업장 입구'], ans:0 },

  // ----- 읽기 (Reading) -----
  { type:'read',
    passage:'화재가 발생하면 ( ① )을/를 눌러 주변 사람들에게 알리세요.',
    q:'①에 들어갈 말로 알맞은 것은?',
    opts:['비상벨','휴대폰 충전기','안전화','계산기'], ans:0,
    exp:'화재 발생 시 주변에 알리려면 비상벨을 누릅니다.' },
  { type:'read',
    passage:'비상벨은 매달 한 번씩 ( ① )해야 합니다. 작동이 잘 되는지 확인하기 위해서입니다.',
    q:'①에 들어갈 말로 알맞은 것은?',
    opts:['점검','주문','판매','세탁'], ans:0,
    exp:'작동 여부를 확인하는 것은 점검입니다.' },
  { type:'read',
    passage:'공장 복도 끝에 비상구가 있습니다. 비상벨은 비상구 바로 옆에 설치되어 있습니다.',
    q:'비상벨은 어디에 있습니까?',
    opts:['복도 끝 비상구 옆','식당 안','주차장','옥상 계단'], ans:0,
    exp:'본문에서 비상벨은 비상구 바로 옆에 있다고 했습니다.' },
  { type:'read',
    passage:'[안전 교육] 오늘 오후 2시, 2층 회의실에서 안전 교육이 있습니다. 모두 참석하세요.',
    q:'안전 교육 장소는 어디입니까?',
    opts:['1층 식당','2층 회의실','3층 사무실','지하 창고'], ans:1,
    exp:'안전 교육은 2층 회의실에서 진행됩니다.' },
  { type:'read',
    passage:'기숙사에서 가스 냄새가 나면 먼저 창문을 열고 즉시 관리자에게 알려야 합니다. 불을 켜거나 전기 기구를 사용하면 안 됩니다.',
    q:'가스 냄새가 날 때 해서는 안 되는 행동은?',
    opts:['창문 열기','관리자에게 알리기','불 켜기','밖으로 나가기'], ans:2,
    exp:'본문은 불을 켜거나 전기 기구를 쓰면 안 된다고 말합니다.' },
  { type:'read',
    passage:'작업 중 다쳤을 때는 혼자 참지 말고 바로 관리자에게 알리세요. 응급 상황이면 119에 전화하세요.',
    q:'다쳤을 때 가장 먼저 해야 할 일은?',
    opts:['혼자 쉰다','관리자에게 바로 알린다','작업을 계속한다','친구에게만 말한다'], ans:1,
    exp:'혼자 참지 말고 바로 관리자에게 알리는 것이 먼저입니다.' }
];

// ---------- Render ----------
function render(){
  let listenHtml = '', readHtml = '';
  Q.forEach((item, i) => {
    const block = `
      <div class="card" id="card${i}">
        <div class="qno">${i+1}번 (Q${i+1})</div>
        ${item.type === 'listen'
          ? `<button class="play" onclick="playAudio(${i})">🔊 듣기 (Play)</button>`
          : `<div class="passage">${item.passage}</div>`}
        <div class="question">${item.q}</div>
        <div class="opts">
          ${item.opts.map((o, j) =>
            `<label><input type="radio" name="q${i}" value="${j}"> ${j+1}. ${o}</label>`
          ).join('')}
        </div>
        <div class="exp" id="exp${i}"></div>
      </div>`;
    if (item.type === 'listen') listenHtml += block; else readHtml += block;
  });
  document.getElementById('listen').innerHTML = listenHtml;
  document.getElementById('read').innerHTML = readHtml;
}

// ---------- Listening (Web Speech API, ko-KR) ----------
function playAudio(i){
  if (!('speechSynthesis' in window)) { alert('이 브라우저는 음성 재생을 지원하지 않습니다.'); return; }
  speechSynthesis.cancel();
  const text = Q[i].script.replace(/(여자|남자):\s*/g, '$1. ');
  for (let k = 0; k < 2; k++){
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }
}

// ---------- Timer ----------
let remaining = 15 * 60;
const timerEl = document.getElementById('timer');
const tick = setInterval(() => {
  remaining--;
  const m = String(Math.floor(remaining / 60)).padStart(2, '0');
  const s = String(remaining % 60).padStart(2, '0');
  timerEl.textContent = `${m}:${s}`;
  if (remaining <= 0){ clearInterval(tick); submitTest(); }
}, 1000);

// ---------- Submit & Score ----------
let submitted = false;
function submitTest(){
  if (submitted) return;
  submitted = true;
  clearInterval(tick);
  speechSynthesis && speechSynthesis.cancel();

  let correct = 0;
  Q.forEach((item, i) => {
    const checked = document.querySelector(`input[name="q${i}"]:checked`);
    const picked = checked ? Number(checked.value) : -1;
    const isOk = picked === item.ans;
    if (isOk) correct++;

    document.querySelectorAll(`input[name="q${i}"]`).forEach(r => r.disabled = true);
    // Highlight correct option
    document.querySelectorAll(`input[name="q${i}"]`)[item.ans].parentElement.style.background = '#dcfce7';

    const expEl = document.getElementById(`exp${i}`);
    const scriptText = item.type === 'listen' ? `<div class="script">스크립트 (Script): ${item.script}</div>` : '';
    const explain = item.exp || '';
    expEl.className = 'exp ' + (isOk ? 'ok' : 'ng');
    expEl.innerHTML = `<b>${isOk ? '정답 ✅ (Correct)' : (picked === -1 ? '미응답 (No answer)' : '오답 ❌ (Wrong)')}</b>
      — 정답: ${item.ans + 1}번 ${item.opts[item.ans]}
      ${explain ? `<div class="script">${explain}</div>` : ''}
      ${scriptText}`;
  });

  const total = Q.length;
  const pct = Math.round(correct / total * 100);
  const res = document.getElementById('result');
  res.style.display = 'block';
  res.innerHTML = `
    <div>총점 (Score)</div>
    <div class="score">${correct} / ${total} (${pct}점 환산 100점 만점)</div>
    <p>${pct >= 80 ? '아주 잘했어요! 🎉 (Excellent!)' : pct >= 60 ? '괜찮아요. 틀린 문제를 다시 확인해 보세요. (Good, review the wrong ones.)' : '조금 더 연습이 필요해요. 💪 (Keep practicing!)'}</p>
    <button class="btn gray" onclick="location.reload()">다시 풀기 (Retry)</button>`;
  document.getElementById('submitBtn').disabled = true;
  res.scrollIntoView({ behavior: 'smooth' });
}

render();
</script>
</body>
</html>
